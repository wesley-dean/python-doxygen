name: Doxygen Python representation experiment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Generate XML from source-preserving candidate
        run: |
          cat > /tmp/Doxyfile <<'EOF'
          PROJECT_NAME = python-doxygen-experiment
          OUTPUT_DIRECTORY = /tmp/doxygen-output
          INPUT = tests/python/expected/00-doxygen-experiment.py
          FILE_PATTERNS = *.py
          RECURSIVE = NO
          GENERATE_HTML = NO
          GENERATE_LATEX = NO
          GENERATE_XML = YES
          XML_OUTPUT = xml
          EXTRACT_ALL = NO
          QUIET = YES
          WARNINGS = YES
          WARN_IF_DOC_ERROR = YES
          EOF
          doxygen /tmp/Doxyfile
          grep -R -q 'Normalize a supplied value' /tmp/doxygen-output/xml
          grep -R -q 'Value to normalize' /tmp/doxygen-output/xml
          grep -R -q 'The canonical normalized value' /tmp/doxygen-output/xml
          grep -R -q 'ValueError' /tmp/doxygen-output/xml
