---
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Versioning
permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  versioning:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install release validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen mawk gawk

      - name: Prepare pinned build dependencies
        run: make deps

      - name: calculate version
        id: calculate-version
        uses: bitshifted/git-auto-semver@c4e8f005e839f822325356f141939cf6c76b5701 # pin@v1
        with:
          create_tag: true
          initial_version: 0.0.1
          tag_prefix: v

      - name: Validate maintained source
        run: make check test-source AWK_BIN=mawk

      - name: Build and validate release artifacts
        run: |
          make test-dist \
            AWK_BIN=mawk \
            VERSION="${{ steps.calculate-version.outputs.version-string }}"

      - name: Exercise release candidates through Doxygen
        run: |
          make test-doxygen-dist \
            AWK_BIN=mawk \
            VERSION="${{ steps.calculate-version.outputs.version-string }}"

      - name: Generate and verify release checksums
        run: |
          make checksums \
            AWK_BIN=mawk \
            VERSION="${{ steps.calculate-version.outputs.version-string }}"
          cd dist
          sha256sum -c doxygen-python.dev.awk.sha256
          sha256sum -c doxygen-python.awk.sha256
          sha256sum -c doxygen-python.min.awk.sha256

      - name: Generate release notes
        id: release-notes
        uses: RedCrafter07/release-notes-action@31674bfa3a219e7c661fc0c5b7b3851c741b9965 # pin@v1.0.1
        with:
          tag-name: "v${{ steps.calculate-version.outputs.version-string }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Create release
        id: create-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # pin@v3.0.3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          name: "v${{ steps.calculate-version.outputs.version-string }}"
          body: "${{ steps.release-notes.outputs.release-notes }}"
          tag_name: "v${{ steps.calculate-version.outputs.version-string }}"
          draft: false
          prerelease: false
          files: |
            dist/doxygen-python.dev.awk
            dist/doxygen-python.dev.awk.sha256
            dist/doxygen-python.awk
            dist/doxygen-python.awk.sha256
            dist/doxygen-python.min.awk
            dist/doxygen-python.min.awk.sha256
