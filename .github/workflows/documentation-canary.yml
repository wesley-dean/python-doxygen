---
name: Documentation canary

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions: read-all

jobs:
  current-source:
    name: Current-source documentation canary
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl doxygen graphviz make mawk

      - name: Prepare stable documentation dependencies
        run: make deps-docs

      - name: Verify prepared dependency state
        run: make deps-docs-check

      - name: Generate project reference documentation
        run: make docs

      - name: Exercise current Python filter through Doxygen
        run: make test-doxygen AWK_BIN=mawk DOXYGEN_PYTHON_FILTER=doxygen-python.awk

      - name: Verify generated documentation state
        run: |
          test -f doc/adr/README.md
          grep -F 'ADR-011' doc/adr/README.md
          git check-ignore -q doc/adr/README.md
          test -z "$(git status --porcelain --untracked-files=all -- doc/adr/README.md)"
          test -f doc/reference/index.html
          git check-ignore -q doc/reference/index.html
          test -z "$(git status --porcelain --untracked-files=all -- doc/reference)"

  released-artifact:
    name: Released Python artifact canary
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install integration tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl doxygen make mawk

      - name: Download exact released Python artifacts and checksums
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .release-canary
          base="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}"
          for artifact in doxygen-python.dev.awk doxygen-python.awk doxygen-python.min.awk; do
            curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 2 \
              "${base}/${artifact}" \
              --output ".release-canary/${artifact}"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 2 \
              "${base}/${artifact}.sha256" \
              --output ".release-canary/${artifact}.sha256"
          done

      - name: Verify released Python artifact bytes
        run: |
          cd .release-canary
          sha256sum -c doxygen-python.dev.awk.sha256
          sha256sum -c doxygen-python.awk.sha256
          sha256sum -c doxygen-python.min.awk.sha256

      - name: Exercise exact released Python artifacts through Doxygen
        run: |
          for artifact in doxygen-python.dev.awk doxygen-python.awk doxygen-python.min.awk; do
            make test-doxygen \
              AWK_BIN=mawk \
              DOXYGEN_PYTHON_FILTER=".release-canary/${artifact}"
          done
